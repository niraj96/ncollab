<!-- Main Chat Container -->
<div class="main-chat-container">
  <!-- Chat Header -->
  <div class="chat-header">
  <div class="chat-header-info">
    <div class="chat-avatar">
      <span class="avatar-text" *ngIf="selectedChatType === 'user'">{{
        getInitials(selectedChatName)
      }}</span>
      <svg
        *ngIf="selectedChatType === 'group'"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M17 21V19C17 17.9 16.1 17 15 17H9C7.9 17 7 17.9 7 19V21"
          stroke="currentColor"
          stroke-width="2"
        />
        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" />
      </svg>
      <span *ngIf="selectedChatType === 'channel'" class="channel-hash">#</span>
    </div>
    <div class="chat-details">
      <h3 class="chat-title">{{ selectedChatName || 'Select a chat' }}</h3>
      <p class="chat-status" *ngIf="selectedChatType === 'user'">Online</p>
      <p class="chat-status" *ngIf="selectedChatType === 'group'">
        {{ getGroupMembers() }} members
      </p>
      <p class="chat-status" *ngIf="selectedChatType === 'channel'">Channel</p>
    </div>
  </div>
  <div class="chat-actions">
    <button class="action-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M3 3h18v18H3zM9 9h6v6H9z" stroke="currentColor" stroke-width="2" />
      </svg>
    </button>
    <button class="action-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path
          d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>
    </button>
    <button class="action-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>
    </button>
  </div>
</div>

<!-- Messages Area -->
<div class="messages-container">
  <div class="messages-list" #messagesContainer>
    <!-- Welcome Message -->
    <div class="welcome-message" *ngIf="!selectedChatName">
      <div class="welcome-content">
        <div class="welcome-icon">
          <svg width="64" height="64" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" fill="#464EB8" />
            <circle cx="14" cy="16" r="3" fill="white" />
            <circle cx="26" cy="16" r="3" fill="white" />
            <circle cx="20" cy="24" r="3" fill="white" />
            <path d="M14 16L20 24" stroke="white" stroke-width="1.5" stroke-linecap="round" />
            <path d="M26 16L20 24" stroke="white" stroke-width="1.5" stroke-linecap="round" />
            <path d="M14 16L26 16" stroke="white" stroke-width="1.5" stroke-linecap="round" />
            <rect x="8" y="8" width="8" height="6" rx="3" fill="#6264F7" />
            <path d="M12 14L10 16L12 18" stroke="#6264F7" stroke-width="1" fill="none" />
          </svg>
        </div>
        <h2 class="welcome-title">Welcome to <span class="highlight-n">n</span>Collab</h2>
        <p class="welcome-subtitle">Select a chat to start messaging</p>
      </div>
    </div>

    <!-- Chat Messages -->
    <div class="message-group" *ngFor="let group of messageGroups">
      <div class="message-date">{{ group.date }}</div>
      <div
        class="message"
        *ngFor="let message of group.messages"
        [class.own-message]="message.isOwn"
      >
        <div class="message-avatar" *ngIf="!message.isOwn">
          <span class="avatar-text">{{ getInitials(message.sender) }}</span>
        </div>
        <div class="message-content">
          <div class="message-header" *ngIf="!message.isOwn">
            <span class="message-sender">{{ message.sender }}</span>
            <span class="message-time">{{ message.time }}</span>
          </div>
          <div class="message-text">{{ message.text }}</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Message Input - Fixed at bottom -->
<div class="message-input-container">
  <div class="input-wrapper">
    <button class="attach-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path
          d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 16.2a2 2 0 0 1-2.83-2.83l8.49-8.49"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>
    </button>
    <div class="input-field">
      <input
        type="text"
        placeholder="Type a message..."
        class="message-input"
        [(ngModel)]="newMessage"
        (keydown.enter)="sendMessage()"
        #messageInput
      />
      <button class="emoji-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
          <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="currentColor" stroke-width="2" />
          <line x1="9" y1="9" x2="9.01" y2="9" stroke="currentColor" stroke-width="2" />
          <line x1="15" y1="9" x2="15.01" y2="9" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
    </div>
    <button class="send-btn" (click)="sendMessage()" [disabled]="!newMessage.trim()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" />
      </svg>
    </button>
  </div>
</div>
</div>
