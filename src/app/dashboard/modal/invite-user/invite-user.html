<div class="modal-overlay" *ngIf="showInviteUserModal" (click)="onCloseModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Invite Users</h2>
      <button class="close-btn" (click)="onCloseModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <form (ngSubmit)="onInviteUsers()" #inviteForm="ngForm">
        <div class="form-group">
          <label for="emails">Email Addresses</label>
          <textarea 
            id="emails" 
            name="emails" 
            [(ngModel)]="inviteData.emails" 
            required 
            class="form-textarea"
            placeholder="Enter email addresses separated by commas or new lines"
            rows="4"
          ></textarea>
          <small class="form-hint">Separate multiple emails with commas or new lines</small>
        </div>
        <div class="form-group">
          <label for="inviteRole">Default Role</label>
          <select 
            id="inviteRole" 
            name="inviteRole" 
            [(ngModel)]="inviteData.role" 
            required 
            class="form-select"
          >
            <option value="">Select a role</option>
            <option value="member">Member</option>
            <option value="guest">Guest</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Personal Message (Optional)</label>
          <textarea 
            id="message" 
            name="message" 
            [(ngModel)]="inviteData.message" 
            class="form-textarea"
            placeholder="Add a personal message to the invitation"
            rows="3"
          ></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" (click)="onCloseModal()">Cancel</button>
      <button type="button" class="btn-primary" (click)="onInviteUsers()" [disabled]="!inviteForm.form.valid">Send Invitations</button>
    </div>
  </div>
</div>
