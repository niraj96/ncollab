<div class="modal-overlay" *ngIf="showStatusModal" (click)="onCloseModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title">Set Status Message</h2>
        <button class="close-btn" (click)="onCloseModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="onSetStatusMessage()" #statusForm="ngForm">
          <div class="form-group">
            <label for="statusMessage">Status Message</label>
            <input 
              type="text" 
              id="statusMessage" 
              name="statusMessage" 
              [(ngModel)]="statusMessage" 
              class="form-input"
              placeholder="What's your status?"
              maxlength="100"
            >
            <small class="form-hint">{{ statusMessage.length }}/100 characters</small>
          </div>
          <div class="form-group">
            <label for="statusDuration">Clear status after</label>
            <select 
              id="statusDuration" 
              name="statusDuration" 
              [(ngModel)]="statusDuration" 
              class="form-select"
            >
              <option value="never">Don't clear</option>
              <option value="1hour">1 hour</option>
              <option value="4hours">4 hours</option>
              <option value="8hours">8 hours</option>
              <option value="tomorrow">Until tomorrow</option>
              <option value="week">Until next week</option>
            </select>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input 
                type="checkbox" 
                [(ngModel)]="showStatusInChat" 
                name="showStatusInChat"
              >
              <span class="checkmark"></span>
              Show when people message you
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="onClearStatusMessage()">Clear status</button>
        <button type="button" class="btn-secondary" (click)="onCloseModal()">Cancel</button>
        <button type="button" class="btn-primary" (click)="onSetStatusMessage()">Set status</button>
      </div>
    </div>
  </div>
